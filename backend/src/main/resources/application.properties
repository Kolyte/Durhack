spring.application.name=codefugue-backend
server.port=8080

# Ranking database (PostgreSQL / TimescaleDB, e.g. Tiger Data).
# Defaults match docker-compose.dev.yml; override with DATABASE_URL / DATABASE_USER / DATABASE_PASSWORD.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/codefugue}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
# The app must start (and keep composing music) even if the database is unreachable.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=5

# Browsers must revalidate pages, otherwise an old index.html keeps loading old JS after a deploy.
spring.web.resources.cache.cachecontrol.no-cache=true
