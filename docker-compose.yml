# Production stack: Spring Boot app (frontend bundled) behind Caddy for automatic HTTPS.
# Configure via a .env file next to this one: DOMAIN=<ip-with-dashes>.sslip.io, GITHUB_TOKEN=..., GEMINI_API_KEY=...
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Ranking database (Tiger Data). Without it the composer works and the leaderboard reports it is offline.
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://localhost:5432/codefugue}
      DATABASE_USER: ${DATABASE_USER:-}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}
      # Optional: Gemini file explanations (key from aistudio.google.com; never commit it).
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      # Optional: "Sign in with GitHub" (OAuth app callback: https://<domain>/login/oauth2/code/github).
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # Optional: Stripe subscriptions for Sonyx Pro (all three needed; until then Pro features are free).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_LABEL: ${STRIPE_PRICE_LABEL:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. 203-0-113-10.sslip.io}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
